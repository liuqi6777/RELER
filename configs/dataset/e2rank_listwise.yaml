# Original E2Rank listwise data: {query, document, ranking, [source]}.
# ``ranking`` is a 1-indexed teacher permutation and is preserved in full.
data_path: data/train.jsonl
per_dataset_max_samples: null
q_max_len: 512
d_max_len: 1024
relevance_scheme: graded

# Public E2Rank records contain exactly 16 documents. For listwise records this
# value is validation metadata (the full list is still preserved); for BGE-M3
# records it remains the requested conversion size.
slate_size: 16
file_glob: "*.jsonl"
batch_per_length_bucket: false
include_sources: null
index_cache_dir: .cache/dataset_index
