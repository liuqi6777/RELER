model_name_or_path: Qwen/Qwen3-Embedding-0.6B
# Checkpoint-native embedding protocol. Keeping this explicit makes model swaps
# auditable and lets standalone evaluation reproduce training-time behavior.
pooling_method: last
padding_side: left
append_token: pad
query_prompt_template: "Instruct: {task_description}\nQuery:{query}"
document_prompt_template: "{document}"
embedding_max_length: 8192
